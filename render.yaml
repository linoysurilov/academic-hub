services:
  - type: web
    name: personal-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DATABASE_URL
        sync: false
      - key: TASKS_API_URL
        sync: false
