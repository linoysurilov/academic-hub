services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: personal_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d personal_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://hub:hub@db:5432/personal_ai
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: personal_ai
      TASKS_API_URL: http://api:8000/tasks
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
